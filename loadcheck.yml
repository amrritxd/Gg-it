name: Load check (own site)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Full URL of your own site'
        required: true
      requests:
        description: 'Total requests (max 100)'
        required: true
        default: '100'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run load check
        env:
          TARGET_URL: ${{ inputs.url }}
          REQUESTS: ${{ inputs.requests }}
          ALLOWED_HOST: ${{ vars.ALLOWED_HOST }}
        run: node loadcheck.mjs
